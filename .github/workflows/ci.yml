name: App CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # expo-env.d.ts is gitignored and normally generated by `expo start`
      - name: Generate Expo type references
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
