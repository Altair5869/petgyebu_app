# 서버가 응답 없이 멈추면 10초 뒤 안내. 준비: 홈이 열린 상태에서 백엔드 프로세스 일시정지(README "서버 응답 멈추기").
appId: host.exp.Exponent
---
- tapOn: "월별 통계"
- extendedWaitUntil: { visible: "서버에 연결할 수 없어요. 다시 시도해 주세요.", timeout: 20000 }
- assertVisible: "다시 시도"
- tapOn: "뒤로"
- tapOn: "지출 기록하기"
- extendedWaitUntil: { visible: "금액을 입력해 주세요", timeout: 20000 }
- tapOn: "지출 금액"
- inputText: "4321"
- waitForAnimationToEnd
- tapOn: "저장"
- extendedWaitUntil: { visible: "저장됐는지 확인하지 못했어요. 월별 통계에서 확인해 주세요.", timeout: 20000 }
- assertVisible: "4,321"
