# 카테고리 목표(F-M08): 이번 달 통계 → 목표 정하기(식비 50,000·카페 10,000) → 남은 금액 → 카페 12,000원 기록 → 초과 → 카테고리 지출 화면.
# 준비: first-login 직후(예산 300,000원, 지출 0건).
appId: com.altair.petgyebu
env:
  APP_URL: ${APP_URL || 'http://127.0.0.1:8081'}
---
- runFlow: ../subflows/open-app.yaml
- extendedWaitUntil: { visible: "고양이, 안정", timeout: 120000 }
- scrollUntilVisible: { element: "월별 통계", direction: DOWN, centerElement: true }
- tapOn: "월별 통계"
- extendedWaitUntil: { visible: "총 지출", timeout: 20000 }

# 1. 목표 정하기
- assertVisible: "이 달에 정한 목표가 없어요."
- tapOn: "목표 정하기"
- extendedWaitUntil: { visible: ".*더 정할 수 있는 금액.*", timeout: 20000 }
- assertVisible: ".*예산 300,000원.*"
- tapOn: "식비 목표 금액"
- inputText: "50000"
- tapOn: "카페 목표 금액"
- inputText: "10000"
- waitForAnimationToEnd
# 입력칸을 바꿀 때 키패드가 잠깐 내려갔다 올라오며 저장 버튼 위치가 흔들린다. 자리가 잡힐 때까지 1.5초 기다린다.
- evalScript: ${(function () { const end = Date.now() + 1500; while (Date.now() < end) {} })()}
- tapOn: "저장"

# 2. 통계의 목표 줄
- extendedWaitUntil: { visible: "식비, 목표 50,000원 중 0원 썼어요, 50,000원 남았어요", timeout: 20000 }
- assertVisible: "카페, 목표 10,000원 중 0원 썼어요, 10,000원 남았어요"

# 3. 카페 12,000원 기록(통계의 "지출 기록하기")
- scrollUntilVisible: { element: "지출 기록하기", direction: DOWN, centerElement: true }
- tapOn: "지출 기록하기"
- extendedWaitUntil: { visible: "금액을 입력해 주세요", timeout: 20000 }
- tapOn: "지출 금액"
- inputText: "12000"
- tapOn: "카페"
- waitForAnimationToEnd
- tapOn: "저장"
- extendedWaitUntil: { visible: "카페, 목표 10,000원 중 12,000원 썼어요, 2,000원 넘었어요", timeout: 20000 }
- assertVisible: "식비, 목표 50,000원 중 0원 썼어요, 50,000원 남았어요"
- takeScreenshot: stats-with-goals

# 4. 카페 목표 줄 → 카테고리 지출 화면
- tapOn: "카페, 목표 10,000원 중 12,000원 썼어요, 2,000원 넘었어요"
- extendedWaitUntil: { visible: "카테고리 지출", timeout: 20000 }
- assertVisible: "12,000원"
- assertVisible: "목표 10,000원 · 2,000원 초과"
- assertNotVisible: "식비"
- takeScreenshot: category-expenses
