# 준비: bootTestRun 연결, first-login 직후의 CAT 계정(예산 300,000원, 현재 월 지출 0건).
# 총 310,000원의 테스트 지출을 생성한다. 재실행 전 현재 월 지출을 초기화한다.
# 금액 경계마다 홈 재조회·상태·잔액·사용률을 검증하고 스크린샷을 저장한다.
appId: com.altair.petgyebu
env:
  APP_URL: ${APP_URL || 'http://127.0.0.1:8081'}
---
- runFlow: ../subflows/open-app.yaml
- extendedWaitUntil: { visible: "고양이, 안정", timeout: 120000 }
- assertVisible: "300,000원 남았어요"
- assertVisible: "사용률 0%"
- assertVisible: "첫 지출을 기록해 보세요"
- assertVisible: "지출 기록하기"
- takeScreenshot: home-zero
- tapOn: "지출 기록하기"
- extendedWaitUntil: { visible: "금액을 입력해 주세요", timeout: 20000 }
- tapOn: "지출 금액"
- inputText: "149999"
- runFlow: ../subflows/tap-save.yaml
- extendedWaitUntil: { visible: "150,001원 남았어요", timeout: 20000 }
- assertVisible: "고양이, 안정"
- assertVisible: "사용률 49.9%"
- assertVisible: "지출 기록하기"
- takeScreenshot: home-stable
- tapOn: "지출 기록하기"
- extendedWaitUntil: { visible: "금액을 입력해 주세요", timeout: 20000 }
- tapOn: "지출 금액"
- inputText: "1"
- runFlow: ../subflows/tap-save.yaml
- extendedWaitUntil: { visible: "150,000원 남았어요", timeout: 20000 }
- assertVisible: "고양이, 주의"
- assertVisible: "사용률 50%"
- assertVisible: "지출 기록하기"
- takeScreenshot: home-caution
- tapOn: "지출 기록하기"
- extendedWaitUntil: { visible: "금액을 입력해 주세요", timeout: 20000 }
- tapOn: "지출 금액"
- inputText: "90000"
- runFlow: ../subflows/tap-save.yaml
- extendedWaitUntil: { visible: "60,000원 남았어요", timeout: 20000 }
- assertVisible: "고양이, 경고"
- assertVisible: "사용률 80%"
- assertVisible: "지출 기록하기"
- takeScreenshot: home-warning
- tapOn: "지출 기록하기"
- extendedWaitUntil: { visible: "금액을 입력해 주세요", timeout: 20000 }
- tapOn: "지출 금액"
- inputText: "60000"
- runFlow: ../subflows/tap-save.yaml
- extendedWaitUntil: { visible: "예산을 모두 사용했어요, 남은 예산 0원", timeout: 20000 }
- assertVisible: "고양이, 예산 도달"
- assertVisible: "사용률 100%"
- assertVisible: "지출 기록하기"
- takeScreenshot: home-reached
- tapOn: "지출 기록하기"
- extendedWaitUntil: { visible: "금액을 입력해 주세요", timeout: 20000 }
- tapOn: "지출 금액"
- inputText: "10000"
- runFlow: ../subflows/tap-save.yaml
- extendedWaitUntil: { visible: "10,000원 초과했어요", timeout: 20000 }
- assertVisible: "고양이, 예산 도달"
- assertVisible: "사용률 103.3%"
- assertVisible: "지출 기록하기"
- takeScreenshot: home-over
- tapOn: "월별 통계"
- extendedWaitUntil: { visible: "총 지출", timeout: 20000 }
- assertVisible: "310,000원"
- assertVisible: "5건"
