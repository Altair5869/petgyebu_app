# 이번 주 돌아보기(F-M07): 지출 없음 → 카페 12,000원 기록 → 늘어난 카테고리 요약과 카테고리별 변화.
# 준비: first-login 직후(예산 300,000원, 지출 0건). 이번 달 예측 카드는 날짜에 따라 문구가 달라 존재만 확인한다.
appId: com.altair.petgyebu
env:
  APP_URL: ${APP_URL || 'http://127.0.0.1:8081'}
---
- runFlow: ../subflows/open-app.yaml
- extendedWaitUntil: { visible: "고양이, 안정", timeout: 120000 }

# 1. 지출이 없으면 빈 안내
- scrollUntilVisible: { element: "이번 주 돌아보기", direction: DOWN, centerElement: true }
- tapOn: "이번 주 돌아보기"
- extendedWaitUntil: { visible: "이번 주와 지난주에 기록한 지출이 없어요", timeout: 20000 }
- assertNotVisible: "카테고리별 변화"
- assertVisible: ".*(이 속도면|이번 달 예산|4일부터).*"
- tapOn: "뒤로|Navigate up"
- extendedWaitUntil: { visible: "고양이, 안정", timeout: 20000 }

# 2. 카페 12,000원 기록
- tapOn: "지출 기록하기"
- extendedWaitUntil: { visible: "금액을 입력해 주세요", timeout: 20000 }
- tapOn: "지출 금액"
- inputText: "12000"
- tapOn: "카페"
- waitForAnimationToEnd
- tapOn: "저장"
- extendedWaitUntil: { visible: "288,000원 남았어요", timeout: 20000 }

# 3. 이번 주가 지난주보다 늘어난 카테고리
- scrollUntilVisible: { element: "이번 주 돌아보기", direction: DOWN, centerElement: true }
- tapOn: "이번 주 돌아보기"
- extendedWaitUntil: { visible: "이번 주에는 지난주보다 카페에 12,000원 더 썼어요", timeout: 20000 }
- assertVisible: "카테고리별 변화"
- assertVisible: ".*(이 속도면|이번 달 예산|4일부터).*"
- takeScreenshot: weekly-insights
