# 설정에서 펫을 강아지로, 이번 달 예산을 450,000원으로 바꾸고 홈에 반영. 준비: first-login 직후(고양이, 300,000원).
appId: com.altair.petgyebu
env:
  APP_URL: http://127.0.0.1:8081
---
- runFlow: ../subflows/open-app.yaml
- extendedWaitUntil: { visible: "고양이 · 안정", timeout: 120000 }
- tapOn: "설정"
- extendedWaitUntil: { visible: "카카오로 로그인됨", timeout: 20000 }
- assertVisible: "300,000원"
- tapOn: "강아지"
# "변경" stays disabled while the pet save is in flight; wait for it to settle.
- extendedWaitUntil:
    visible:
      text: "변경"
      enabled: true
    timeout: 20000
- tapOn: "변경"
- extendedWaitUntil: { visible: "예산 금액", timeout: 20000 }
# Wait for the push animation before focusing the field.
- waitForAnimationToEnd
- tapOn: "예산 금액"
- waitForAnimationToEnd
- eraseText: 20
- inputText: "450000"
- assertVisible: "450,000"
- waitForAnimationToEnd
- tapOn: "저장"
- extendedWaitUntil: { visible: "450,000원", timeout: 20000 }
- tapOn: "뒤로"
- extendedWaitUntil: { visible: "강아지 · 안정", timeout: 20000 }
- assertVisible: "450,000원 남았어요"
